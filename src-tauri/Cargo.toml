[package]
name = "shoruipoppu"
version = "0.1.0"
description = "A local, read-only document viewer"
authors = ["ShoruiPoppu contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
calamine = "0.37.0"
csv = "1.4.0"
libc = "0.2.191"
pulldown-cmark = "0.13.5"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
